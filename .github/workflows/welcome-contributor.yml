name: Welcome First-Time Contributor

on:
  pull_request_target:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  welcome:
    name: Welcome Contributor
    runs-on: ubuntu-latest
    if: github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR' || github.event.pull_request.author_association == 'FIRST_TIMER' || github.event.pull_request.author_association == 'NONE'
    steps:
      - name: Post Welcome Message
        uses: actions/github-script@v7
        with:
          script: |
            const author = context.payload.pull_request.user.login;
            const commentBody = `### 👋 Welcome to HEMA, @${author}! 🩸🚀

            Thank you for taking the time to open a pull request on the HEMA Community Blood Donor Platform! We are thrilled to welcome you to our mission of connecting lifesavers with patients in critical need.

            ---

            ### 🔍 What Happens Next?
            1. **Automated Verification**: Our [Continuous Integration (CI)](https://github.com/TheVicky1/Hema/actions/workflows/ci.yml) workflow is currently verifying:
               - 🔒 Zero-Secret Security Scan
               - 🔗 Markdown Link Integrity
               - 🧹 ESLint Code Quality
               - 🏗️ Vite Production Build
            2. **Maintainer Review**: A core maintainer (@TheVicky1) will review your pull request shortly.
            3. **Friendly Iteration**: If any adjustments are needed, we will provide clear, constructive feedback to help get your PR merged smoothly.

            ---

            ### 📚 Helpful Quick Links
            - 📖 [Contributing Guide](https://github.com/TheVicky1/Hema/blob/main/docs/CONTRIBUTING.md)
            - 🎨 [Design System Specification](https://github.com/TheVicky1/Hema/blob/main/docs/DESIGN_SYSTEM.md)
            - 🏗️ [Architecture Guide](https://github.com/TheVicky1/Hema/blob/main/docs/ARCHITECTURE.md)
            - 💬 [Community Discussions](https://github.com/TheVicky1/Hema/discussions)

            *Thank you for helping make HEMA better! Search. Connect. Save Lives. Repeat.* 🩸✨`;

            const { data: existingComments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number
            });

            const alreadyWelcomed = existingComments.some(c => c.body && c.body.includes('Welcome to HEMA'));
            if (!alreadyWelcomed) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: commentBody
              });
            }

