name: Continuous Integration

on:
  push:
    branches: [main, 'community/**', 'feat/**', 'fix/**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gates:
    name: Quality Gates & Verification (20.x)
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ['20.x']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Clean install dependencies
        run: npm ci

      - name: 🔒 Zero-Secret Scan
        run: node scratch/secret-scan.mjs

      - name: 🔗 Markdown Relative Link Audit
        run: node scratch/check-links.mjs

      - name: 🧹 ESLint Code Quality
        run: npm run lint

      - name: 🏗️ Vite Production Build
        run: npm run build
